services:
  roadpolice-web:
    build: .
    container_name: roadpolice-web
    restart: unless-stopped
    # от имени snippy на snnas: data/ остаётся его, sudo chown не нужен
    user: "1000:1000"
    # Только localhost: наружу сервис выставляет tailscale serve на :10443.
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      TZ: Asia/Yerevan
    volumes:
      - ./bank:/app/bank:ro   # bank.json и images/ из roadpolice-trainer/assets
      - ./data:/app/data      # trainer.db — прогресс
